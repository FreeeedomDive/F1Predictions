spring:
  application:
    name: f1-predictions
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: false
  modulith:
    events:
      republish-outstanding-events-on-restart: true

server:
  port: 8080

discord:
  enabled: false
  token: ""

imports:
  api-key: ${IMPORT_API_KEY:}

sessions:
  hash-secret: ${SESSION_HASH_SECRET}
  cleanup-interval: PT1H

races:
  transition-scheduler:
    enabled: true
    interval: PT1M
  calendar-sync:
    enabled: true
    season: 2026
    interval: P1D

jolpica:
  base-url: https://api.jolpi.ca/ergast/f1
  connect-timeout: PT3S
  read-timeout: PT10S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    metrics:
      export:
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        aggregation-temporality: cumulative
        base-time-unit: seconds
        step: 60s
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
  tracing:
    sampling:
      probability: 1.0

---
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      # Local runs use src/ as their working directory in both IntelliJ and Gradle.
      file: ../LocalRuns/compose.local.yaml

sessions:
  hash-secret: ${SESSION_HASH_SECRET:local-development-only-session-hash-key}

logging:
  threshold:
    console: INFO
