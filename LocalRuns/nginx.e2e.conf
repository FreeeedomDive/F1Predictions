events {}

http {
    server {
        listen 80;
        access_log off;
        proxy_set_header Host $host;

        location /api/ {
            proxy_pass http://host.docker.internal:18081;
        }

        location /adminApi/ {
            proxy_pass http://host.docker.internal:18081;
        }

        location /e2e/ {
            return 404;
        }

        location / {
            proxy_pass http://host.docker.internal:15174;
        }
    }
}
