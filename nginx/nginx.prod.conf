worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;

        # /internal/ is deliberately absent
        # internal endpoints are reaches over the ClusterIP service, so they stay off the public host.

        location /api/ {
            proxy_pass http://f1-predictions-api-clusterip-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /adminApi/ {
            proxy_pass http://f1-predictions-api-clusterip-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://f1-predictions-frontend-clusterip-service:6925;
            proxy_set_header Host $host;
        }
    }
}
