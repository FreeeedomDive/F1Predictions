services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: f1predictions
      POSTGRES_USER: f1predictions
      POSTGRES_PASSWORD: f1predictions
    ports:
      - "55433:5432"
    volumes:
      - f1predictions_postgresql:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "8089:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  f1predictions_postgresql:
